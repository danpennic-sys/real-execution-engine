[package]
name = "real-execution-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.38", features = ["serde", "clock"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
rusqlite = { version = "0.29.0", features = ["bundled"] }
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.12.0"
